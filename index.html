
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #240046;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: #10002B;
      border: 2px solid #5A189A;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 0 20px rgba(199, 125, 255, 0.2);
    }

    h1 {
      color: #FFD166;
      margin-top: 0;
    }

    h2 {
      color: #C77DFF;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #5A189A;
      background: #240046;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #FFB703;
      color: #240046;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #5A189A;
      color: white;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .player {
      background: #240046;
      border: 1px solid #5A189A;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .player.current {
      border: 2px solid #FFD166;
      color: #FFD166;
    }

    .roulette {
      width: 180px;
      height: 180px;
      margin: 20px auto;
      border-radius: 50%;
      border: 8px solid #FFD166;
      background: conic-gradient(
        #FFB703 0deg 45deg,
        #C77DFF 45deg 90deg,
        #7B2CBF 90deg 135deg,
        #FFB703 135deg 180deg,
        #C77DFF 180deg 225deg,
        #7B2CBF 225deg 270deg,
        #FFB703 270deg 315deg,
        #C77DFF 315deg 360deg
      );
      display: flex;
      justify-content: center;
      align-items: center;
      color: #240046;
      font-size: 40px;
      font-weight: bold;
      transition: transform 3s cubic-bezier(0.15, 0.65, 0.15, 1);
    }

    .status {
      color: #C77DFF;
      font-size: 14px;
      margin: 12px 0;
    }

    .number {
      color: #FFD166;
      font-size: 48px;
      font-weight: bold;
      margin: 15px 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- TELA INICIAL -->
    <section id="home" class="screen active">
      <h1>🎵 Music Game</h1>
      <p>Entre no jogo e divirta-se com seus amigos!</p>

      <input
        type="text"
        id="playerName"
        placeholder="Digite seu nome"
        maxlength="25"
      >

      <button id="enterButton" onclick="enterGame()">
        Entrar no jogo
      </button>

      <p class="status" id="connectionStatus">
        Conectando ao jogo...
      </p>
    </section>

    <!-- SALA -->
    <section id="lobby" class="screen">
      <h1>🎶 Sala de música</h1>
      <p>Jogadores conectados:</p>

      <div id="playersList"></div>

      <p class="status" id="lobbyStatus">
        Aguardando jogadores...
      </p>

      <button id="startButton" onclick="startGame()">
        Começar jogo
      </button>

      <button class="secondary" onclick="goHome()">
        Sair da sala
      </button>
    </section>

    <!-- JOGO -->
    <section id="game" class="screen">
      <h1>🎵 Music Game</h1>

      <h2>Vez de:</h2>
      <div id="currentPlayerName">Aguardando...</div>

      <div class="roulette" id="roulette">?</div>

      <div class="number" id="songNumber">?</div>

      <p id="gameMessage">
        Gire a roleta para sortear uma música!
      </p>

      <button id="spinButton" onclick="spinRoulette()">
        🎡 Girar roleta
      </button>

      <button
        id="nextButton"
        class="hidden"
        onclick="nextPlayer()"
      >
        Próximo jogador
      </button>

      <div id="gamePlayers"></div>

      <button class="secondary" onclick="goHome()">
        Sair do jogo
      </button>
    </section>

  </div>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get,
      set,
      update,
      remove,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    // CONFIGURAÇÃO DO SEU FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBu2ZU6i80AXqVvDHIx65BH0orY8gu_wBs",
      authDomain: "music-game-8b752.firebaseapp.com",
      databaseURL: "https://music-game-8b752-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "music-game-8b752",
      storageBucket: "music-game-8b752.firebasestorage.app",
      messagingSenderId: "663909367921",
      appId: "1:663909367921:web:ea9e3670e63dfd64c01bd0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Todos os celulares usam a mesma sala.
    const ROOM_ID = "familia-music-game";
    const roomRef = ref(db, "rooms/" + ROOM_ID);

    let user = null;
    let roomData = null;
    let stopListening = null;
    let spinningLocally = false;
    let animationTimer = null;
    let rotation = 0;

    const $ = (id) => document.getElementById(id);

    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });

      $(screenId).classList.add("active");
    }

    function setStatus(message) {
      $("connectionStatus").textContent = message;
    }

    function showError(message) {
      alert(message);
    }

    async function enterGame() {
      const name = $("playerName").value.trim();

      if (!name) {
        showError("Digite seu nome antes de entrar.");
        return;
      }

      $("enterButton").disabled = true;
      setStatus("Conectando...");

      try {
        const credential = await signInAnonymously(auth);
        user = credential.user;

        // Cria a sala caso ainda não exista.
        const snapshot = await get(roomRef);

        if (!snapshot.exists()) {
          await set(roomRef, {
            players: {},
            currentPlayer: "",
            lastNumber: null,
            spinning: false,
            gameStarted: false
          });
        }

        const playersRef = ref(
          db,
          "rooms/" + ROOM_ID + "/players"
        );

        const playersSnapshot = await get(playersRef);
        const players = playersSnapshot.val() || {};

        const existingPlayer = players[user.uid];

        // Registra ou atualiza este jogador.
        await set(
          ref(db, "rooms/" + ROOM_ID + "/players/" + user.uid),
          {
            name: name,
            points: existingPlayer?.points || 0
          }
        );

        const currentRoomSnapshot = await get(roomRef);
        const currentRoom = currentRoomSnapshot.val() || {};

        if (!currentRoom.currentPlayer) {
          await update(roomRef, {
            currentPlayer: user.uid
          });
        }

        if (stopListening) {
          stopListening();
        }

        stopListening = onValue(roomRef, (snap) => {
          roomData = snap.val();

          if (!roomData) {
            return;
          }

          renderRoom();
        });

        setStatus("Conectado!");
        showScreen("lobby");
      } catch (error) {
        console.error(error);
        showError(
          "Não foi possível entrar. Confira a configuração do Firebase e tente novamente."
        );
        setStatus("Falha na conexão.");
      } finally {
        $("enterButton").disabled = false;
      }
    }

    function renderRoom() {
      if (!roomData) {
        return;
      }

      const players = roomData.players || {};
      const playerIds = Object.keys(players);

      updatePlayersList(players);

      if (roomData.gameStarted) {
        showScreen("game");
        updateGamePlayers(players);
        updateTurn(players);

        const number = roomData.lastNumber;

        $("songNumber").textContent =
          number == null ? "?" : number;

        $("roulette").textContent =
          number == null ? "?" : number;

        $("spinButton").disabled =
          Boolean(roomData.spinning) || number != null;

        $("nextButton").classList.toggle(
          "hidden",
          number == null || Boolean(roomData.spinning)
        );

        if (number == null) {
          $("gameMessage").textContent =
            roomData.spinning
              ? "A roleta está girando..."
              : "Gire a roleta para sortear uma música!";
        } else {
          $("gameMessage").textContent =
            "Música sorteada! Procure a música correspondente ao número " +
            number + ".";
        }

        if (roomData.spinning && !spinningLocally) {
          animateRemoteSpin();
        }
      } else {
        showScreen("lobby");

        $("lobbyStatus").textContent =
          playerIds.length +
          (playerIds.length === 1
            ? " jogador na sala"
            : " jogadores na sala");

        $("startButton").disabled = playerIds.length === 0;
      }
    }

    function updatePlayersList(players) {
      const list = $("playersList");
      list.innerHTML = "";

      Object.entries(players).forEach(([id, player]) => {
        const item = document.createElement("div");
        item.className = "player";

        const name = document.createElement("span");
        name.textContent = player.name || "Jogador";

        const points = document.createElement("span");
        points.textContent = (player.points || 0) + " pts";

        item.appendChild(name);
        item.appendChild(points);
        list.appendChild(item);
      });
    }

    function updateGamePlayers(players) {
      const list = $("gamePlayers");
      list.innerHTML = "";

      Object.entries(players).forEach(([id, player]) => {
        const item = document.createElement("div");

        item.className =
          "player" +
          (id === roomData.currentPlayer ? " current" : "");

        const name = document.createElement("span");
        name.textContent = player.name || "Jogador";

        const points = document.createElement("span");
        points.textContent = (player.points || 0) + " pts";

        item.appendChild(name);
        item.appendChild(points);
        list.appendChild(item);
      });
    }

    function updateTurn(players) {
      const currentId = roomData.currentPlayer;
      const current = players[currentId];

      $("currentPlayerName").textContent =
        current ? current.name : "Aguardando jogador";
    }

    async function startGame() {
      if (!user) {
        showError("Entre na sala primeiro.");
        return;
      }

      try {
        const snapshot = await get(roomRef);
        const data = snapshot.val() || {};
        const players = data.players || {};
        const ids = Object.keys(players);

        if (ids.length === 0) {
          showError("É necessário ter pelo menos um jogador.");
          return;
        }

        await update(roomRef, {
          gameStarted: true,
          currentPlayer: data.currentPlayer || ids[0],
          lastNumber: null,
          spinning: false
        });
      } catch (error) {
        console.error(error);
        showError("Não foi possível iniciar o jogo.");
      }
    }

    function animateRoulette() {
      rotation += 1440 + Math.floor(Math.random() * 720);
      $("roulette").style.transform =
        "rotate(" + rotation + "deg)";
    }

    function animateRemoteSpin() {
      if (animationTimer) {
        return;
      }

      animateRoulette();

      animationTimer = setTimeout(() => {
        animationTimer = null;
      }, 3000);
    }

    async function spinRoulette() {
      if (!user || !roomData) {
        return;
      }

      if (roomData.currentPlayer !== user.uid) {
        showError("Aguarde sua vez de jogar.");
        return;
      }

      if (roomData.lastNumber != null || roomData.spinning) {
        return;
      }

      spinningLocally = true;
      $("spinButton").disabled = true;

      try {
        const result = await runTransaction(roomRef, (data) => {
          if (!data || !data.gameStarted) {
            return;
          }

          if (data.currentPlayer !== user.uid) {
            return;
          }

          if (data.spinning || data.lastNumber != null) {
            return;
          }

          data.spinning = true;
          return data;
        });

        if (!result.committed) {
          spinningLocally = false;
          return;
        }

        animateRoulette();

        await new Promise((resolve) => {
          setTimeout(resolve, 3000);
        });

        const number = Math.floor(Math.random() * 30) + 1;

        await update(roomRef, {
          lastNumber: number,
          spinning: false
        });
      } catch (error) {
        console.error(error);
        showError("Não foi possível girar a roleta.");
      } finally {
        spinningLocally = false;
        $("spinButton").disabled = false;
      }
    }

    async function nextPlayer() {
      if (!user || !roomData) {
        return;
      }

      if (roomData.currentPlayer !== user.uid) {
        showError("Somente o jogador da vez pode avançar.");
        return;
      }

      const players = roomData.players || {};
      const ids = Object.keys(players);

      if (ids.length === 0) {
        return;
      }

      const currentIndex = ids.indexOf(roomData.currentPlayer);
      const nextIndex =
        currentIndex < 0 ? 0 : (currentIndex + 1) % ids.length;

      try {
        await update(roomRef, {
          currentPlayer: ids[nextIndex],
          lastNumber: null,
          spinning: false
        });
      } catch (error) {
        console.error(error);
        showError("Não foi possível passar a vez.");
      }
    }

    async function goHome() {
      if (animationTimer) {
        clearTimeout(animationTimer);
        animationTimer = null;
      }

      if (stopListening) {
        stopListening();
        stopListening = null;
      }

      if (user) {
        try {
          const snapshot = await get(roomRef);
          const data = snapshot.val();

          if (data && data.players && data.players[user.uid]) {
            const players = { ...data.players };
            delete players[user.uid];

            const ids = Object.keys(players);
            let currentPlayer = data.currentPlayer;

            if (currentPlayer === user.uid) {
              currentPlayer = ids[0] || "";
            }

            await update(roomRef, {
              players,
              currentPlayer
            });
          }
        } catch (error) {
          console.error("Não foi possível remover o jogador:", error);
        }
      }

      user = null;
      roomData = null;
      spinningLocally = false;

      $("playerName").value = "";
      $("roulette").textContent = "?";
      $("roulette").style.transform = "rotate(0deg)";
      $("songNumber").textContent = "?";
      $("gameMessage").textContent =
        "Gire a roleta para sortear uma música!";

      showScreen("home");
      setStatus("Pronto para entrar.");
    }

    // Torna as funções acessíveis aos botões HTML.
    window.enterGame = enterGame;
    window.startGame = startGame;
    window.spinRoulette = spinRoulette;
    window.nextPlayer = nextPlayer;
    window.goHome = goHome;

    setStatus("Pronto para entrar.");
  </script>
</body>
</html>
